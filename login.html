<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="login.html">Entrar</a></li>
        <li><a class="botao" href="cadastro.html">Criar conta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form class="formulario" id="form-login">
      <h1>Entrar</h1>
      <p>Use o e-mail e a senha do seu cadastro.</p>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <p id="erro" class="erro" role="alert"></p>
      <button class="botao" type="submit">Entrar</button>
      <p>Novo por aqui? <a href="cadastro.html">Criar conta</a></p>
    </form>
  </main>

  <footer>
    <ul>
